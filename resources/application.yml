server:
  port: ${PORT:8000}
  address: 0.0.0.0

spring:
  application:
    name: fastapi-service
  threads:
    virtual:
      enabled: true

# Logging
logging:
  level:
    root: INFO
    example: DEBUG

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info
    health:
      show-details: always
      
minio:
  endpoint: ${MINIO_ENDPOINT:http://minio:9000}
  bucket: ${MINIO_BUCKET}
