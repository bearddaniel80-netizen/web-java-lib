server:
  port: ${PORT:4000}
  address: 0.0.0.0

spring:
  application:
    name: bff-service
  http:
    client:
      factory: simple
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 105MB

# Logging
logging:
  level:
    root: INFO
    example: DEBUG

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info
    health:
      show-details: always
      
fastapi:
  url: ${FASTAPI_URL}
  secret-file: ${FASTAPI_INTERNAL_KEY_FILE:/run/secrets/fastapi_internal_key}
